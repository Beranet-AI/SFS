networks:
  sfs_net:

volumes:
  postgres_data:

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: sfs-mosquitto
    networks:
    - sfs_net
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
  # -----------------------
  # Base image (Shared Kernel)
  # -----------------------
  base:
    image: sfs_base:latest
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.base
    networks:
      - sfs_net

  postgres:
    image: postgres:15
    container_name: sfs-postgres
    restart: always
    environment:
      POSTGRES_DB: sfs
      POSTGRES_USER: sfs
      POSTGRES_PASSWORD: sfs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sfs_net

  management:
    container_name: sfs-management
    build:
      context: ../..
      dockerfile: infrastructure/docker/management/Dockerfile
    depends_on:
      - base
      - postgres
    env_file:
      - ../env/management.env
    ports:
      - "8000:8000"
    networks:
      - sfs_net
    develop:
      watch:
        # هر تغییری در shared → rebuild base
        - action: rebuild
          path: ../../backend/shared
  

  commands_worker:
    build:
      context: ../../
      dockerfile: infrastructure/docker/commands_worker/Dockerfile

    container_name: sfs-commands-worker

    working_dir: /app/backend/services/management

    environment:
      PYTHONPATH: /app/backend/services/management
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://sfs:sfs@postgres:5432/sfs
      EDGE_CONTROLLER_BASE_URL: http://edge_controller:8003
      LOG_LEVEL: info
      TIME_ZONE: Asia/Tehran

    depends_on:
      postgres:
        condition: service_started
      edge_controller:
        condition: service_started

    networks:
      sfs_net:








  data_ingestion:
    container_name: sfs-data-ingestion
    build:
      context: ../..
      dockerfile: infrastructure/docker/data_ingestion/Dockerfile
    depends_on:
      - base
      - postgres
    env_file:
      - ../env/data_ingestion.env
    ports:
      - "8001:8001"
    networks:
      - sfs_net

  monitoring:
    container_name: sfs-monitoring
    build:
      context: ../..
      dockerfile: infrastructure/docker/monitoring/Dockerfile
    depends_on:
      - base
      - postgres
    env_file:
      - ../env/monitoring.env
    ports:
      - "8002:8002"
    networks:
      - sfs_net

  edge_controller:
    container_name: sfs-edge-controller
    build:
      context: ../..
      dockerfile: infrastructure/docker/edge_controller/Dockerfile
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      - base
      - postgres
    env_file:
      - ../env/edge_controller.env
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
    ports:
      - "8003:8003"
    networks:
      - sfs_net

  ai_decision:
    container_name: sfs-ai-decision
    build:
      context: ../..
      dockerfile: infrastructure/docker/ai_decision/Dockerfile
    depends_on:
      - base
      - postgres
    env_file:
      - ../env/ai_decision.env
    ports:
      - "8004:8004"
    networks:
      - sfs_net
  webapp:
    container_name: sfs-webapp
    restart: always
    build:
      context: ../..
      dockerfile: infrastructure/docker/webapp/Dockerfile
    depends_on:
      - management
      - monitoring
      - ai_decision
    ports:
      - "3000:3000"
    networks:
      - sfs_net
