{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
  <h1>{% trans "Discover Devices" %}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    <fieldset class="module aligned">
      {% for field in form %}
        <div class="form-row{% if field.errors %} errors{% endif %}">
          {{ field.errors }}
          {{ field.label_tag }}
          {{ field }}
        </div>
      {% endfor %}
    </fieldset>
    <div class="submit-row">
      <input type="submit" value="{% trans "Start Discovery" %}" class="default">
    </div>
  </form>
{% endblock %}
