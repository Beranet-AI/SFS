{% extends "admin/change_list.html" %}
{% load i18n %}

{% block content %}
  <div class="module">
    <h2>{% trans "Discover Devices" %}</h2>
    <form method="post" action="{% url 'admin:commands_discovery_start' %}" novalidate>
      {% csrf_token %}
      <fieldset class="module aligned">
        {% for field in form %}
          <div class="form-row{% if field.errors %} errors{% endif %}">
            {{ field.errors }}
            {{ field.label_tag }}
            {{ field }}
          </div>
        {% endfor %}
      </fieldset>
      <div class="submit-row">
        <input type="submit" value="{% trans "Start Discovery" %}" class="default">
      </div>
    </form>
  </div>
  {{ block.super }}
{% endblock %}
